<html xmlns="http://www.w3.org/1999/html">
<head>
    <script src="../node_modules/jquery/dist/jquery.js"></script>
    <script src="https://code.jquery.com/jquery-1.12.1.min.js"></script>
    <script src='../node_modules/markdown-it/dist/markdown-it.js'></script>
    <script src="../node_modules/to-mark/dist/to-mark.js"></script>
    <script src="../node_modules/tui-code-snippet/dist/tui-code-snippet.js"></script>
    <script src="../node_modules/codemirror/lib/codemirror.js"></script>
    <script src="../node_modules/squire-rte/build/squire-raw.js"></script>
    <link rel="stylesheet" href="../node_modules/codemirror/lib/codemirror.css">
    <script src="../node_modules/tui-editor/dist/tui-editor-Editor.js"></script>
    <script src="../node_modules/tui-chart/dist/tui-chart.js"></script>
    <script src="../node_modules/tui-editor/dist/tui-editor-extTable.js"></script>
    <script src="../node_modules/tui-editor/dist/tui-editor-extChart.js"></script>
    <script src="../node_modules/plantuml-encoder/dist/plantuml-encoder.js"></script>
    <script src="../node_modules/tui-editor/dist/tui-editor-extUML.js"></script>
    <link rel="stylesheet" href="../node_modules/tui-editor/dist/tui-editor.css">
    <link rel="stylesheet" href="../node_modules/tui-chart/dist/tui-chart.css">
    <link rel="stylesheet" href="../node_modules/tui-editor/dist/tui-editor-contents.css">
    <title>FaStack</title>
    <link rel="stylesheet" type="text/css" href="stackInfo.css">
</head>
<body class="draggable">

<div>
    <div class="rows">
        <div class="column">
            <br>
            <p id="createTaskTitle">Settings</p>
            <form id="updateSettings">
                <div class="tab">
                </div>
                <div id="syncSection" style="display:none">
                    <hr>
                    <p style="color:white; margin-bottom:6px;">Push local stack to cloud</p>
                    <center><input id="syncRepoName" type="text" placeholder="Cloud repo/folder name" style="width:80%; margin-bottom:8px;"></center>
                    <center><input type="button" id="syncGithub" value="Github"></center>
                    <center><input type="button" id="syncDropbox" value="Dropbox"></center>
                    <center><input type="button" id="syncGoogle" value="Google Drive"></center>
                    <center><span id="syncStatus" style="color:#d9a441; font-size:12px; display:block; margin-top:6px;"></span></center>
                    <hr>
                </div>
                <span id="error" class="error"><br><br></span>
                <br>
                <br>
                <center><input type="submit" id="update" value="Update Settings"></center>
                <center><input type="submit" id="goBack" value="Go Back"></center>
            </form>
        </div>
    </div>
</div>
<script charset="utf-8" type="text/javascript" src="./createTask.js"></script>
<script charset="utf-8" type="text/javascript" src="./settings.js"></script>
<script charset="utf-8" type="text/javascript" src="./setting.js"></script>

</body>
</html>
