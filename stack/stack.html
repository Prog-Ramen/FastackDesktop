<html>
<head>
  <title>FaStack</title>
  <script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
  <script src="https://code.jquery.com/jquery-1.12.1.min.js"></script>
  <link rel="stylesheet" type="text/css" href="./stack.css">
  <link rel="stylesheet" type="text/css" href="./tutorial.css">
  <link rel="stylesheet" type="text/css" href="../jquery-ui.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.3/jquery.easing.compatibility.js"></script>
  <script charset="utf-8" type="text/javascript" src="../jquery-ui.min.js"></script> 
  <script>if (window.module) module = window.module;</script>
</head>
<body class="draggable">
<div class='container'>
    <div class="fastack-toolbar">
      <img id="addButton" class="tb-icon" src="../images/add.png" alt="Add new task" title="Add task" tabindex="0" role="button" height="18" width="18">
      <img id="timeButton" class="tb-icon" src="../images/clock.png" alt="Clock in" title="Clock in or out" tabindex="0" role="button" height="20" width="20">
      <span id="reportButton" class="tb-icon tb-svg" title="Productivity report" aria-label="Productivity report" tabindex="0" role="button">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17 L3 3"/>
          <path d="M3 17 L17 17"/>
          <rect x="6" y="10" width="2.5" height="5" fill="currentColor" stroke="none"/>
          <rect x="10" y="6" width="2.5" height="9" fill="currentColor" stroke="none"/>
          <rect x="14" y="12" width="2.5" height="3" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <img id="settingsButton" class="tb-icon" src="../images/settings.png" alt="Settings" title="Settings" tabindex="0" role="button" height="20" width="20">
      <span class="backend-pill" id="backendPill"></span>
      <img id="logout" class="tb-icon" src="../images/logout.png" alt="Sign out" title="Sign out" tabindex="0" role="button" height="20" width="20">
    </div>
    <div class="stack s1">
    </div>
</div>
</body>

<script charset="utf-8" type="text/javascript" src="./stack.js"></script>
<script charset="utf-8" type="text/javascript" src="./settings.js"></script>
<script>
  // Tour: init() resumes an in-progress tour AND auto-starts on first run.
  var __tour = require('../helper/tutorial');
  __tour.init();
</script>
</html>
